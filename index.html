<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Son Kez... ☕</title>
    <!-- Türkçe Karakter Uyumlu Google Font Entegrasyonu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        }

        body {
            background-color: #efebe9;
            color: #1b1b1b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 2px solid #d7ccc8;
        }

        .icon {
            font-size: 52px;
            margin-bottom: 12px;
            display: inline-block;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .tag {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
            color: #5d4037;
            margin-bottom: 10px;
            font-weight: 800;
        }

        h1 {
            font-size: 28px;
            color: #2c1d11;
            margin-bottom: 14px;
            font-weight: 700;
            line-height: 1.3;
        }

        p.description {
            font-size: 15px;
            color: #3e2723;
            line-height: 1.6;
            margin-bottom: 22px;
            font-weight: 500;
        }

        .details-box {
            background-color: #f5ebe6;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 22px;
            border: 2px dashed #bcaaa4;
            text-align: left;
        }

        .detail-item {
            margin: 12px 0;
        }

        .detail-item strong {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: #4e342e;
            letter-spacing: 1px;
            margin-bottom: 4px;
            font-weight: 800;
        }

        .detail-item span {
            font-size: 15px;
            color: #1b1b1b;
            font-weight: 700;
        }

        /* Input Kutusu */
        .custom-input {
            width: 100%;
            padding: 10px 12px;
            margin-top: 6px;
            border: 2px solid #a1887f;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            color: #3e2723;
            background-color: #ffffff;
            outline: none;
        }

        .custom-input:focus {
            border-color: #4e342e;
        }

        .coffee-selection {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 2px dashed #bcaaa4;
        }

        .coffee-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        .coffee-option {
            padding: 10px 12px;
            background: #ffffff;
            border: 2px solid #a1887f;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #3e2723;
            transition: all 0.2s ease;
            user-select: none;
        }

        .coffee-option input {
            display: none;
        }

        .coffee-option.active {
            border-color: #4e342e;
            background-color: #4e342e;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(78, 52, 46, 0.3);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            text-align: center;
        }

        .btn-accept {
            background-color: #128c7e;
            color: #ffffff;
        }

        .btn-accept:hover {
            background-color: #0e6c61;
        }

        .btn-reject {
            background-color: #c62828;
            color: #ffffff;
        }

        .btn-reject:hover {
            background-color: #b71c1c;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 14px;
            color: #4e342e;
            font-style: italic;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">☕</div>
        <div class="tag">Özel Davet</div>
        <h1>Son Kez...</h1>
        <p class="description">Bu gece baş başa bir kahve içip kısa bir sohbet etmeye ne dersin?</p>

        <div class="details-box">
            <div class="detail-item">
                <strong>Zaman 🌙</strong>
                <span>Bugün Gece</span>
            </div>

            <div class="detail-item">
                <strong>Nerede İçelim? (Mekan / Konum) 📍</strong>
                <input type="text" id="location-input" class="custom-input" placeholder="Tercih ettiğin mekanı yaz..." oninput="updateWhatsAppLink()">
            </div>

            <div class="coffee-selection">
                <strong style="display:block; font-size:12px; text-transform:uppercase; color:#4e342e; letter-spacing:1px; margin-bottom:6px; font-weight:800;">Kahven Nasıl Olsun? ☕</strong>
                <div class="coffee-options">
                    <label class="coffee-option active" id="opt-latte" onclick="selectCoffee('Sütlü Latte')">
                        <input type="radio" name="coffee" value="Sütlü Latte" checked>
                        🥛 Sütlü Latte
                    </label>
                    <label class="coffee-option" id="opt-americano" onclick="selectCoffee('Americano')">
                        <input type="radio" name="coffee" value="Americano">
                        ☕ Americano
                    </label>
                    <label class="coffee-option" id="opt-turkish" onclick="selectCoffee('Türk Kahvesi')">
                        <input type="radio" name="coffee" value="Türk Kahvesi">
                        🇹🇷 Türk Kahvesi
                    </label>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <a id="wa-accept-btn" href="#" target="_blank" class="btn btn-accept">
                Kabul Ediyorum ☕
            </a>
            
            <a id="wa-reject-btn" href="#" target="_blank" class="btn btn-reject">
                Nazikçe Reddet 💔
            </a>
        </div>

        <div class="footer-note">
            Kararın ne olursa olsun saygı duyuyorum...
        </div>
    </div>

    <script>
        let selectedCoffee = "Sütlü Latte";
        const phone = "905367731907";

        function selectCoffee(choice) {
            selectedCoffee = choice;
            
            document.getElementById('opt-latte').classList.remove('active');
            document.getElementById('opt-americano').classList.remove('active');
            document.getElementById('opt-turkish').classList.remove('active');
            
            if (choice === 'Sütlü Latte') {
                document.getElementById('opt-latte').classList.add('active');
            } else if (choice === 'Americano') {
                document.getElementById('opt-americano').classList.add('active');
            } else {
                document.getElementById('opt-turkish').classList.add('active');
            }

            updateWhatsAppLink();
        }

        function updateWhatsAppLink() {
            const locationVal = document.getElementById('location-input').value.trim();
            
            let locationText = "";
            if (locationVal) {
                locationText = ` Mekan olarak şurayı tercih ederim: ${locationVal}.`;
            }

            // Kabul Mesajı
            const acceptText = "Davetini kabul ediyorum. Bugün gece kahve içebiliriz! Kahve tercihim: " + selectedCoffee + "." + locationText;
            document.getElementById('wa-accept-btn').href = "https://wa.me/" + phone + "?text=" + encodeURIComponent(acceptText);

            // Red Mesajı
            const rejectText = "Davetin için teşekkür ederim ama bu gece katılamayacağım...";
            document.getElementById('wa-reject-btn').href = "https://wa.me/" + phone + "?text=" + encodeURIComponent(rejectText);
        }

        // Sayfa yüklendiğinde linkleri hazırla
        updateWhatsAppLink();
    </script>

</body>
</html>
